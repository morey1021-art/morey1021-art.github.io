<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pin TOEFL">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pin TOEFL 背單字</title>
<style>
:root{
 --bg:#f5f6f8;--card:#fff;--text:#17191c;--muted:#69707d;--line:#e2e5e9;
 --accent:#0f766e;--accentSoft:#e7f4f2;--good:#137333;--goodSoft:#eaf6ed;
 --warn:#946200;--warnSoft:#fff5d6;--bad:#b42318;--badSoft:#fdeceb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",system-ui,sans-serif}
body{padding-bottom:calc(158px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(15,118,110,.22);outline-offset:2px}
.top{
 position:sticky;top:0;z-index:20;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;
 background:rgba(245,246,248,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand h1{font-size:20px;line-height:1.1;margin:0;font-weight:780;letter-spacing:-.25px}
.stats{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:#e8eaed;border-radius:11px;padding:3px;margin-bottom:8px}
.tab{height:38px;border:0;border-radius:9px;background:transparent;font-weight:680;color:#58606c}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.controls{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:7px}
.controls input,.controls select,.filterbar select{
 width:100%;height:43px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);
 padding:0 11px;font-size:16px;outline:none
}
.filterbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
main{padding:12px 11px 28px;max-width:760px;margin:0 auto}
.chapter{margin-bottom:20px}
.chapterTitle{display:flex;justify-content:space-between;align-items:end;padding:0 5px 7px}
.chapterTitle h2{font-size:17px;margin:0;font-weight:740}
.chapterTitle span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.word{
 border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:72px;padding:8px;
 display:grid;grid-template-columns:38px minmax(0,1fr) 44px;gap:5px;align-items:center
}
.word.playing{border-color:var(--accent);background:var(--accentSoft)}
.word.learned{border-left:4px solid var(--good)}
.idx{font-size:12px;color:#9aa0aa;text-align:center}
.wordMain{border:0;background:transparent;padding:5px 3px;text-align:left;color:var(--text);min-width:0}
.term{font-size:17px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}
.zh{font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.side{display:flex;flex-direction:column;gap:4px}
.iconbtn{
 width:40px;height:30px;border:0;border-radius:9px;background:#f2f3f5;color:#717784;font-size:16px;
 display:grid;place-items:center
}
.iconbtn.favorite{background:var(--warnSoft);color:var(--warn)}
.iconbtn.done{background:var(--goodSoft);color:var(--good);font-size:14px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:54px 20px}
.install{display:none;margin:10px 11px 0;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.5}
.install.show{display:block}.install b{color:var(--accent)}

.player{
 position:fixed;z-index:30;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid var(--line)
}
.playerInner{max-width:760px;margin:0 auto}
.now{height:28px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.nowText{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.nowText b{font-weight:750}.nowText span{color:var(--muted);margin-left:5px}
.navrow{display:grid;grid-template-columns:46px 1fr 46px 1.25fr 46px;gap:6px}
.navbtn,.replay,.continuous,.stop{
 height:42px;border-radius:11px;border:1px solid var(--line);font-weight:720
}
.navbtn,.replay,.stop{background:#fff;color:var(--text)}
.continuous{border:0;background:var(--accent);color:#fff}
.stop{color:var(--bad)}
.more{margin-top:6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.speed{display:flex;background:#f0f1f3;border-radius:9px;padding:2px}
.speed button{border:0;background:transparent;border-radius:7px;height:34px;min-width:39px;font-size:12px;color:#5c6370}
.speed button.active{background:#fff;color:var(--accent);font-weight:780;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.voice{min-width:0;width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 7px;color:#525866;font-size:12px}
.pause{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;font-size:12px}

/* Quiz */
.quizWrap{padding:2px 0 20px}
.quizSetup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quizSetup select,.quizSetup button{height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 10px}
.quizSetup button{background:var(--accent);color:#fff;border:0;font-weight:730}
.quizCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 14px}
.quizMeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:20px}
.quizPrompt{font-size:25px;font-weight:800;line-height:1.25;text-align:center;padding:12px 8px 22px;overflow-wrap:anywhere}
.quizPrompt.zhq{font-size:21px}
.answers{display:grid;gap:9px}
.answer{min-height:51px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 12px;text-align:left;font-size:15px}
.answer.correct{border-color:var(--good);background:var(--goodSoft);color:var(--good)}
.answer.wrong{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}
.quizFeedback{min-height:45px;padding:12px 3px 2px;font-size:14px;line-height:1.45}
.quizActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quizActions button{height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:720}
.quizActions .primary{background:var(--accent);border:0;color:#fff}
.progressRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.progressCard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.progressCard .n{font-size:19px;font-weight:790}.progressCard .l{font-size:12px;color:var(--muted);margin-top:2px}

@media(min-width:700px){
 .list{display:grid;grid-template-columns:1fr 1fr}
 main{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><h1>Pin TOEFL 背單字</h1><div id="stats" class="stats"></div></div>
 <div class="tabs">
  <button id="tabReading" class="tab active" type="button">閱讀</button>
  <button id="tabListening" class="tab" type="button">聽力</button>
  <button id="tabQuiz" class="tab" type="button">隨機測驗</button>
 </div>
 <div id="studyControls">
  <div class="controls">
   <input id="q" type="search" placeholder="搜尋英文或中文" autocomplete="off" autocorrect="off" spellcheck="false">
   <select id="section"></select>
  </div>
  <div class="filterbar">
   <select id="stateFilter">
    <option value="all">全部單字</option>
    <option value="favorite">⭐ 收藏</option>
    <option value="unlearned">未背</option>
    <option value="learned">✓ 已背</option>
   </select>
   <select id="sortFilter">
    <option value="original">原本順序</option>
    <option value="az">A → Z</option>
   </select>
  </div>
 </div>
</header>

<div id="installTip" class="install"><b>加入 iPhone 主畫面：</b>用 Safari 開啟 → 分享 →「加入主畫面」。收藏與已背進度會保存在這台裝置。</div>

<main id="content"></main>

<div id="player" class="player">
 <div class="playerInner">
  <div class="now"><div id="nowText" class="nowText">點單字播放一次</div></div>
  <div class="navrow">
   <button id="prev" class="navbtn" type="button" aria-label="上一個">‹</button>
   <button id="replay" class="replay" type="button">▶ 播放</button>
   <button id="next" class="navbtn" type="button" aria-label="下一個">›</button>
   <button id="playAll" class="continuous" type="button">連續播放</button>
   <button id="stop" class="stop" type="button" aria-label="停止">■</button>
  </div>
  <div class="more">
   <div class="speed">
    <button type="button" data-rate="0.75">0.75×</button>
    <button type="button" data-rate="1" class="active">1×</button>
    <button type="button" data-rate="1.25">1.25×</button>
   </div>
   <select id="voice" class="voice" aria-label="美式英文語音"><option value="">自動選擇美式英文語音</option></select>
   <button id="pause" class="pause" type="button">暫停</button>
  </div>
 </div>
</div>

const synth=window.speechSynthesis;
const STORE_KEY='pin_toefl_vocab_v2';
let view='reading', rate=1, voices=[], selectedVoiceURI='', runId=0, currentId=null, currentEl=null, paused=false;
let quiz=null;
let state=loadState();

const $=id=>document.getElementById(id);
const content=$('content'), q=$('q'), section=$('section'), stateFilter=$('stateFilter'), sortFilter=$('sortFilter');
const stats=$('stats'), voiceSel=$('voice'), nowText=$('nowText'), player=$('player'), studyControls=$('studyControls');

function defaultState(){return {favorites:{},learned:{},quizCorrect:0,quizTotal:0}}
function loadState(){
 try{
  const x=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
  return x&&typeof x==='object'?Object.assign(defaultState(),x):defaultState();
 }catch(e){return defaultState()}
}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
function bookEntries(){return DB[view]||[]}
function allEntries(){return [...DB.reading,...DB.listening]}
function sections(){
 const a=[];for(const e of bookEntries())if(!a.includes(e.section))a.push(e.section);return a;
}
function updateSectionOptions(){
 const old=section.value;
 section.innerHTML='<option value="">全部章節</option>'+sections().map(s=>`<option value="${escAttr(s)}">${esc(s)}</option>`).join('');
 if([...section.options].some(o=>o.value===old))section.value=old;
}
function filtered(){
 const query=q.value.trim().toLowerCase(),sec=section.value,flag=stateFilter.value;
 let a=bookEntries().filter(e=>{
  if(sec&&e.section!==sec)return false;
  if(query&&!(`${e.term} ${e.zh}`.toLowerCase().includes(query)))return false;
  if(flag==='favorite'&&!state.favorites[e.id])return false;
  if(flag==='learned'&&!state.learned[e.id])return false;
  if(flag==='unlearned'&&state.learned[e.id])return false;
  return true;
 });
 if(sortFilter.value==='az')a=[...a].sort((x,y)=>x.term.localeCompare(y.term,'en'));
 return a;
}
function updateStats(){
 if(view==='quiz'){stats.textContent=`答對 ${state.quizCorrect} / ${state.quizTotal}`;return}
 const total=bookEntries().length;
 const learned=bookEntries().filter(e=>state.learned[e.id]).length;
 const fav=bookEntries().filter(e=>state.favorites[e.id]).length;
 stats.textContent=`已背 ${learned}/${total} · ⭐ ${fav}`;
}
function renderStudy(){
 const list=filtered();updateStats();
 if(!list.length){content.innerHTML='<div class="empty">目前沒有符合的單字</div>';return}
 const counts={};list.forEach(e=>counts[e.section]=(counts[e.section]||0)+1);
 let h='',cur='';
 list.forEach(e=>{
  if(e.section!==cur){
   if(cur)h+='</div></section>';
   cur=e.section;
   h+=`<section class="chapter"><div class="chapterTitle"><h2>${esc(cur)}</h2><span>${counts[cur]} 個</span></div><div class="list">`;
  }
  const original=bookEntries().findIndex(x=>x.id===e.id)+1;
  const fav=!!state.favorites[e.id],done=!!state.learned[e.id];
  h+=`<article class="word ${done?'learned':''}" data-id="${e.id}">
   <div class="idx">${original}</div>
   <button class="wordMain" type="button" data-action="speak" data-id="${e.id}">
    <div class="term">${esc(e.term)}</div><div class="zh">${esc(e.zh)}</div>
   </button>
   <div class="side">
    <button class="iconbtn ${fav?'favorite':''}" data-action="favorite" data-id="${e.id}" type="button" aria-label="收藏">${fav?'★':'☆'}</button>
    <button class="iconbtn ${done?'done':''}" data-action="learned" data-id="${e.id}" type="button" aria-label="已背">${done?'✓':'○'}</button>
   </div>
  </article>`;
 });
 if(cur)h+='</div></section>';
 content.innerHTML=h;
 content.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handleWordAction));
 refreshCurrentHighlight();
}
function getEntry(id){return allEntries().find(e=>e.id===id)||null}
function handleWordAction(ev){
 const b=ev.currentTarget,id=b.dataset.id,action=b.dataset.action,e=getEntry(id);if(!e)return;
 if(action==='speak'){speakEntry(e,true);return}
 if(action==='favorite'){
  if(state.favorites[id])delete state.favorites[id];else state.favorites[id]=true;
  saveState();renderStudy();return;
 }
 if(action==='learned'){
  if(state.learned[id])delete state.learned[id];else state.learned[id]=true;
  saveState();renderStudy();return;
 }
}
function setView(v){
 stopSpeech();view=v;
 $('tabReading').classList.toggle('active',v==='reading');
 $('tabListening').classList.toggle('active',v==='listening');
 $('tabQuiz').classList.toggle('active',v==='quiz');
 const isQuiz=v==='quiz';
 studyControls.style.display=isQuiz?'none':'block';
 player.style.display=isQuiz?'none':'block';
 if(isQuiz){renderQuiz()}else{
  q.value='';section.value='';stateFilter.value='all';sortFilter.value='original';
  updateSectionOptions();renderStudy();window.scrollTo({top:0,behavior:'smooth'});
 }
}
$('tabReading').addEventListener('click',()=>setView('reading'));
$('tabListening').addEventListener('click',()=>setView('listening'));
$('tabQuiz').addEventListener('click',()=>setView('quiz'));
[q,section,stateFilter,sortFilter].forEach(x=>x.addEventListener(x===q?'input':'change',renderStudy));

function voiceScore(v){
 const n=(v.name||'').toLowerCase(),lang=(v.lang||'').toLowerCase();let s=0;
 if(lang==='en-us')s+=120;else if(lang.startsWith('en-us'))s+=100;else if(lang.startsWith('en'))s+=20;
 if(/premium|enhanced|natural|siri/.test(n))s+=70;
 if(/samantha|ava|allison|alex|tom|nicky|aaron|google us|aria|jenny|guy/.test(n))s+=40;
 return s;
}
function loadVoices(){
 if(!synth)return;
 voices=synth.getVoices().filter(v=>/^en(-|_)/i.test(v.lang||'')).sort((a,b)=>voiceScore(b)-voiceScore(a));
 voiceSel.innerHTML='<option value="">自動：最佳美式英文語音</option>';
 voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=`${v.name} (${v.lang})`;voiceSel.appendChild(o)});
 if(selectedVoiceURI&&voices.some(v=>v.voiceURI===selectedVoiceURI))voiceSel.value=selectedVoiceURI;
}
loadVoices();
if(synth&&'onvoiceschanged' in synth)synth.onvoiceschanged=loadVoices;
voiceSel.addEventListener('change',()=>selectedVoiceURI=voiceSel.value);
function chooseVoice(){
 if(selectedVoiceURI){const x=voices.find(v=>v.voiceURI===selectedVoiceURI);if(x)return x}
 return voices[0]||null;
}
document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>{
 rate=Number(b.dataset.rate);
 document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('active',x===b));
}));
function makeUtter(term){
 const u=new SpeechSynthesisUtterance(term);u.lang='en-US';u.rate=rate;u.pitch=1;
 const v=chooseVoice();if(v)u.voice=v;return u;
}
function refreshCurrentHighlight(){
 document.querySelectorAll('.word.playing').forEach(x=>x.classList.remove('playing'));
 if(!currentId)return;
 const a=content.querySelector(`.word[data-id="${CSS.escape(currentId)}"]`);
 if(a){a.classList.add('playing');currentEl=a}
}
function setCurrent(e,scroll=true){
 currentId=e.id;refreshCurrentHighlight();
 nowText.innerHTML=`<b>${esc(e.term)}</b><span>${esc(e.zh)}</span>`;
 if(scroll&&currentEl)currentEl.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function clearPlaying(){
 document.querySelectorAll('.word.playing').forEach(x=>x.classList.remove('playing'));
 currentEl=null;
}
function stopSpeech(){
 runId++;if(synth)synth.cancel();paused=false;$('pause').textContent='暫停';clearPlaying();
}
$('stop').addEventListener('click',stopSpeech);
function speakEntry(e,stopAfter=true){
 if(!synth||!e)return;
 const my=++runId;synth.cancel();paused=false;$('pause').textContent='暫停';setCurrent(e,true);
 const u=makeUtter(e.term);
 u.onend=()=>{if(my===runId&&stopAfter)clearPlaying()};
 u.onerror=er=>{if(my===runId&&er.error!=='canceled'&&er.error!=='interrupted'&&stopAfter)clearPlaying()};
 synth.speak(u);
}
function currentList(){return filtered()}
function currentIndex(){
 const a=currentList();let i=a.findIndex(e=>e.id===currentId);return {a,i};
}
function move(delta){
 const {a,i}=currentIndex();if(!a.length)return;
 let ni=i<0?(delta>0?0:a.length-1):Math.max(0,Math.min(a.length-1,i+delta));
 speakEntry(a[ni],true);
}
$('prev').addEventListener('click',()=>move(-1));
$('next').addEventListener('click',()=>move(1));
$('replay').addEventListener('click',()=>{
 let e=currentId?getEntry(currentId):null;
 if(!e){const a=currentList();e=a[0]}
 if(e)speakEntry(e,true);
});
function playContinuousAt(a,index,my){
 if(my!==runId||index>=a.length){clearPlaying();return}
 const e=a[index];setCurrent(e,true);const u=makeUtter(e.term);
 u.onend=()=>{if(my===runId)setTimeout(()=>playContinuousAt(a,index+1,my),180)};
 u.onerror=er=>{if(my===runId&&er.error!=='canceled'&&er.error!=='interrupted')setTimeout(()=>playContinuousAt(a,index+1,my),180)};
 synth.speak(u);
}
$('playAll').addEventListener('click',()=>{
 const a=currentList();if(!a.length||!synth)return;
 const my=++runId;synth.cancel();paused=false;$('pause').textContent='暫停';
 let start=currentId?a.findIndex(e=>e.id===currentId):0;if(start<0)start=0;
 playContinuousAt(a,start,my);
});
$('pause').addEventListener('click',()=>{
 if(!synth||!currentId)return;
 if(paused){synth.resume();paused=false;$('pause').textContent='暫停'}
 else{synth.pause();paused=true;$('pause').textContent='繼續'}
});

/* Quiz */
function sample(arr,n){
 const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a.slice(0,n);
}
function uniqueDistractors(pool,keyField,correctId,n=3){
 const seen=new Set();const out=[];
 for(const e of sample(pool,pool.length)){
  if(e.id===correctId)continue;
  const val=(e[keyField]||'').trim();if(!val||seen.has(val))continue;
  seen.add(val);out.push(e);if(out.length>=n)break;
 }
 return out;
}
function newQuizQuestion(){
 const source=$('quizSource')?.value||'all';
 const direction=$('quizDirection')?.value||'en-zh';
 let pool=source==='reading'?DB.reading:source==='listening'?DB.listening:allEntries();
 if(pool.length<4)return;
 const correct=pool[Math.floor(Math.random()*pool.length)];
 const key=direction==='en-zh'?'zh':'term';
 const distractors=uniqueDistractors(pool,key,correct.id,3);
 if(distractors.length<3){quiz=null;return}
 const options=sample([correct,...distractors],4);
 quiz={source,direction,correct,options,answered:false,selected:null};
}
function renderQuiz(){
 updateStats();
 if(!quiz)newQuizQuestion();
 const source=quiz?.source||'all',direction=quiz?.direction||'en-zh';
 const prompt=quiz?(direction==='en-zh'?quiz.correct.term:quiz.correct.zh):'';
 let h=`<div class="quizWrap">
  <div class="quizSetup">
   <select id="quizSource">
    <option value="all" ${source==='all'?'selected':''}>閱讀＋聽力</option>
    <option value="reading" ${source==='reading'?'selected':''}>只考閱讀</option>
    <option value="listening" ${source==='listening'?'selected':''}>只考聽力</option>
   </select>
   <select id="quizDirection">
    <option value="en-zh" ${direction==='en-zh'?'selected':''}>英文 → 中文</option>
    <option value="zh-en" ${direction==='zh-en'?'selected':''}>中文 → 英文</option>
   </select>
  </div>`;
 if(!quiz){h+='<div class="empty">無法產生題目</div></div>';content.innerHTML=h;return}
 h+=`<div class="quizCard">
   <div class="quizMeta"><span>${quiz.correct.book==='reading'?'閱讀':'聽力'} · ${esc(quiz.correct.section)}</span><span>隨機四選一</span></div>
   <div class="quizPrompt ${direction==='zh-en'?'zhq':''}">${esc(prompt)}</div>
   <div class="answers">`;
 quiz.options.forEach((e,i)=>{
  const label=direction==='en-zh'?e.zh:e.term;
  let cls='answer';
  if(quiz.answered){
   if(e.id===quiz.correct.id)cls+=' correct';
   else if(e.id===quiz.selected)cls+=' wrong';
  }
  h+=`<button class="${cls}" type="button" data-qid="${e.id}" ${quiz.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(label)}</button>`;
 });
 h+=`</div>
   <div class="quizFeedback">`;
 if(quiz.answered){
  h+=quiz.selected===quiz.correct.id
   ?`答對了。<b>${esc(quiz.correct.term)}</b>：${esc(quiz.correct.zh)}`
   :`正確答案：<b>${esc(quiz.correct.term)}</b>：${esc(quiz.correct.zh)}`;
 }
 h+=`</div>
   <div class="quizActions">
    <button id="quizSpeak" type="button">▶ 聽發音</button>
    <button id="quizNext" class="primary" type="button">下一題</button>
   </div>
  </div>
  <div class="progressRow">
   <div class="progressCard"><div class="n">${state.quizCorrect}</div><div class="l">累計答對</div></div>
   <div class="progressCard"><div class="n">${state.quizTotal?Math.round(state.quizCorrect/state.quizTotal*100):0}%</div><div class="l">正確率</div></div>
  </div>
 </div>`;
 content.innerHTML=h;
 $('quizSource').addEventListener('change',()=>{quiz=null;newQuizQuestion();renderQuiz()});
 $('quizDirection').addEventListener('change',()=>{quiz=null;newQuizQuestion();renderQuiz()});
 content.querySelectorAll('[data-qid]').forEach(b=>b.addEventListener('click',()=>{
  if(quiz.answered)return;
  quiz.selected=b.dataset.qid;quiz.answered=true;state.quizTotal++;
  if(quiz.selected===quiz.correct.id){state.quizCorrect++;state.learned[quiz.correct.id]=true}
  saveState();renderQuiz();
 }));
 $('quizSpeak').addEventListener('click',()=>{
  if(!synth)return;synth.cancel();const u=makeUtter(quiz.correct.term);synth.speak(u);
 });
 $('quizNext').addEventListener('click',()=>{const s=$('quizSource').value,d=$('quizDirection').value;quiz=null;newQuizQuestion();quiz.source=s;quiz.direction=d;
  // regenerate if chosen mode differs from the defaults used above
  const pool=s==='reading'?DB.reading:s==='listening'?DB.listening:allEntries();
  const correct=pool[Math.floor(Math.random()*pool.length)], key=d==='en-zh'?'zh':'term',dist=uniqueDistractors(pool,key,correct.id,3);
  quiz={source:s,direction:d,correct,options:sample([correct,...dist],4),answered:false,selected:null};renderQuiz();
 });
}
const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!standalone)$('installTip').classList.add('show');
updateSectionOptions();renderStudy();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
